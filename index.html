  <div style="max-width:780px;margin:16px auto;padding:0 16px">
<div id="eng-bar" style="margin:12px 0;padding:10px;background:#0f172a;border:1px solid #334155;border-radius:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
  <label style="background:#1e293b;color:#93c5fd;border:1px solid #475569;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">📂 Загрузить .json / .csv<input type="file" accept=".json,.csv,.txt" style="display:none" onchange="window._engLoad(this)"></label>
  <button type="button" onclick="window._engPreset(true)" style="background:#064e3b;color:#6ee7b7;border:1px solid #059669;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">✅ Тест: Валидные данные</button>
  <button type="button" onclick="window._engPreset(false)" style="background:#7f1d1d;color:#fca5a5;border:1px solid #dc2626;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer">⛔ Тест: Нарушение правила</button>
  <span id="eng-fn" style="font-size:12px;color:#94a3b8"></span>
</div>
<textarea style="width:100%;height:90px;background:#030712;color:#a7f3d0;border:1px solid #374151;border-radius:8px;padding:10px;font-family:monospace">{"verified":true}</textarea></div><script>
(function(){
  function tgt(){return document.querySelector('textarea')||document.querySelector('input[type=text]');}
  function run(){var b=Array.from(document.querySelectorAll('button')).find(function(x){return /проверить|verify|check|run|сертифик/i.test(x.textContent||'');});if(b)b.click();}
  window._engPreset=function(ok){var t=tgt();if(!t)return;t.value=ok?JSON.stringify({status:"valid",verified:true,amount:15000,kex:"ML-KEM-768",human_oversight:true,quorum_nodes:5},null,2):JSON.stringify({status:"violation",verified:false,amount:-500,kex:"RSA-2048",human_oversight:false,quorum_nodes:1},null,2);run();};
  window._engLoad=function(inp){var f=inp.files&&inp.files;if(!f)return;var fn=document.getElementById('eng-fn');if(fn)fn.textContent=f.name;var r=new FileReader();r.onload=function(e){var raw=String(e.target.result||'').trim();if(f.name.toLowerCase().endsWith('.csv')&&raw.charAt(0)!=='{'){var ls=raw.split(/\r?\n/).filter(Boolean);if(ls.length>=2){var ks=ls.split(','),vs=ls.split(','),o={};ks.forEach(function(k,i){var v=(vs[i]||'').trim(),n=Number(v);o[k.trim()]=isNaN(n)?(v==='true'?true:(v==='false'?false:v)):n;});raw=JSON.stringify(o,null,2);}}var t=tgt();if(t){t.value=raw;run();}};r.readAsText(f);};
})();
</script></body>
